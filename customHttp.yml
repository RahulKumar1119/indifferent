customHeaders:
  - pattern: '**/*'
    headers:
      - key: Strict-Transport-Security
        value: max-age=63072000; includeSubDomains; preload
      - key: X-Content-Type-Options
        value: nosniff
      - key: X-Frame-Options
        value: DENY
      - key: Referrer-Policy
        value: strict-origin-when-cross-origin
      - key: Content-Security-Policy
        value: >-
          default-src 'self';
          script-src 'self' 'unsafe-inline' https://dataplane.rum.ap-south-1.amazonaws.com https://pagead2.googlesyndication.com https://www.googletagmanager.com https://www.google-analytics.com;
          style-src 'self' 'unsafe-inline';
          img-src 'self' data: blob: https:;
          font-src 'self' data: https:;
          connect-src 'self' https://api.indifferent.fun https://dataplane.rum.ap-south-1.amazonaws.com https://cognito-identity.ap-south-1.amazonaws.com https://www.google-analytics.com https://pagead2.googlesyndication.com;
          frame-src https://googleads.g.doubleclick.net https://tpc.googlesyndication.com;
          frame-ancestors 'none';
          base-uri 'self';
          form-action 'self';
          object-src 'none';
          upgrade-insecure-requests
      - key: Permissions-Policy
        value: camera=(), microphone=(), geolocation=(), payment=()
      - key: Cross-Origin-Opener-Policy
        value: same-origin
      - key: Cross-Origin-Resource-Policy
        value: same-origin
