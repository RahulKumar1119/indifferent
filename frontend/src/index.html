  <!-- Theme color -->

  <script>
    // Apply the saved theme (default dark) before Angular bootstraps so there
    // is no flash of the wrong theme on first paint. A saved theme counts only
    // while the visitor allows Functional (#321): this reads the same consent
    // record as the app (core/consent/consent.model.ts; a spec keeps the key and
    // the version in step) and otherwise uses the default.
    (function () {
      var theme = 'dark';
      try {
        var c = JSON.parse(localStorage.getItem('indifferent.consent.v1') || 'null');
        if (c && c.version === 1 && Date.parse(c.expiresAt) > Date.now() && c.choices && c.choices.functional === true) {
          var stored = localStorage.getItem('app-theme');
          if (stored === 'dark' || stored === 'light') theme = stored;
        }
      } catch (e) {}
      var root = document.documentElement;
      root.classList.toggle('dark', theme === 'dark');
      root.setAttribute('data-theme', theme);
      root.style.colorScheme = theme;
      var meta = document.querySelector('meta[name="theme-color"]');
      if (meta) {
        meta.setAttribute('content', theme === 'dark' ? '#0a0a0a' : '#FAF7F2');
      }
    })();
  </script>
