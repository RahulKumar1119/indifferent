version: 1
applications:
  - frontend:
      phases:
        preBuild:
          commands:
            - cd frontend
            - npm ci
        build:
          commands:
            - npx ng build --configuration production
            - node scripts/prerender.mjs
            # Fatal: every self-hosted font must be on the checked list, carry its licence and have its files.
            - node scripts/check-fonts.mjs
            # Warning only while the policy is report-only; make it fatal (drop the || echo) when it is enforced.
            - node scripts/check-csp.mjs || echo "WARNING - customHttp.yml hashes are out of date, see above"
      artifacts:
        baseDirectory: frontend/dist/frontend/browser
        files:
          - '**/*'
      cache:
        paths:
          - frontend/node_modules/**/*
    appRoot: .
customRules:
  - source: '/<*>'
    target: /index.html
    status: '404-200'
